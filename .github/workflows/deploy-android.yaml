name: Android Release

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploying to Playstore
    runs-on: ubuntu-latest
    container: reactnativecommunity/react-native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Fix git permissions
        run: git config --global --add safe.directory /__w/mobile/mobile

      - name: verify git tag exists
        run: git describe --tags --abbrev=0

      - uses: c-hive/gha-yarn-cache@v1

      - name: Install node modules
        run: |
          yarn install

      - name: Copy .env
        run: |
          yarn deploy:copyDevEnv

      - name: Cache Gradle Wrapper
        uses: actions/cache@v2
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle Dependencies
        uses: actions/cache@v2
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-
      - name: Install ruby bundle
        run: |
          bundle install --jobs 4 --retry 4
      - name: 'Build and deploy on Play Store'
        uses: maierj/fastlane-action@v2.2.0
        with:
          lane: 'android deploy_to_internal_testing'
          skip-tracking: true
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          PLAYSTORE_JSON_KEY_BASE64: ${{ secrets.PLAYSTORE_JSON_KEY_BASE64 }}
