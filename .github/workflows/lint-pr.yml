name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
jobs:
  main:
    if: startsWith(github.head_ref, 'l10n') == false && startsWith(github.head_ref, 'i10n') == false
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v4.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
