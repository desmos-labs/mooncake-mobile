name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
    branches-ignore:
      - '!l10n_localisation'
      - '!l10n_*'
jobs:
  main:
    if: ${{ !contains(github.refs, 'l10n') }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v4.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
