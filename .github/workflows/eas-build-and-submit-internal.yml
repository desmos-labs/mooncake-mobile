name: EAS Build and Submit (Internal)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: EAS Build and Submit (Internal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node 🔨
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: npm

      - name: Setup Expo and EAS 🔧
        uses: expo/expo-github-action@v8
        with:
          expo-cache: false
          eas-cache: false
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies 📦
        run: yarn install
      
      - name: google-services.json 📄 
        env:
          GOOGLE_SERVICES_JSON: ${{secrets.GOOGLE_SERVICES_JSON}}
        run:  
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json;
      
      - name: GoogleService-Info.plist 📄 
        env:
          GOOGLE_SERVICES_INFO_PLIST: ${{secrets.GOOGLE_SERVICES_INFO_PLIST}}
        run: 
          echo "$GOOGLE_SERVICES_INFO_PLIST" | base64 --decode > GoogleService-Info.plist;

      - name: Build and Submit on EAS 🚀
        run: eas build --platform all --profile production --non-interactive --auto-submit-with-profile=internal
