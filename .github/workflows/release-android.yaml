name: Release Android

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-RC*'

jobs:
  deploy:
    name: Deploy Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v3

#      - name: Compute diff 📜
#        uses: technote-space/get-diff-action@v6.1.2
#        id: git_diff
#        with:
#          PATTERNS: +(src|__tests__)/**/*.+(js|jsx|ts|tsx)
#          FILES: |
#            package.json
#            yarn.lock

      - name: Setup Node 👷
#        if: env.GIT_DIFF
        uses: actions/setup-node@v3
        with:
          node-version: 16.x
          cache: yarn
          cache-dependency-path: |
            yarn.lock

      - name: Setup JDK 11 🔧
#        if: env.GIT_DIFF
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: 11

      - name: Setup Android SDK 🔧
        if: env.GIT_DIFF
        uses: android-actions/setup-android@v2

      - name: Setup ruby 🔧
        if: env.GIT_DIFF
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.3'
          bundler-cache: true

      - name: Setup Gradle cache 🗄
#        if: env.GIT_DIFF
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get version info ⚙
#        if: env.GIT_DIFF
        id: version-info
        run: bundle exec fastlane common populate_github_env

      - name: Install yarn dependencies 🔨
#        if: env.GIT_DIFF
        run: yarn install --immutable

      - name: Prepare production .env file 🔨
#        if: env.GIT_DIFF
        run: bundler exec fastlane common write_env_file
        env:
          ENV_TESTING_BASE64: ${{ secrets.ENV_TESTING_BASE64 }}

      - name: Build bundle 🔨
#        if: env.GIT_DIFF
        run: bundle exec fastlane android build_bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Build apk 🔨
#        if: env.GIT_DIFF
        run: bundle exec fastlane android build_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Deploy on Play Store 🚀
#        if: env.GIT_DIFF
        run: bundle exec fastlane android deploy_bundle
        env:
          PLAYSTORE_JSON_KEY: ${{ secrets.PLAYSTORE_JSON_KEY_BASE64 }}

      - name: Upload APKs to release 🚀
#        if: env.GIT_DIFF
        uses: svenstaro/upload-release-action@v2
        with:
          tag: ${{ github.ref }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: android/app/build/outputs/apk/release/*.apk
          overwrite: true
          prerelease: ${{ steps.version-info.outputs.IS_INTERNAL_RELEASE }}
